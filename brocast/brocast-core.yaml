# ---------------------------------------------------------------------------
# Themen-Dictionaries: Keys in dat, je typ eigener Namensraum
# ---------------------------------------------------------------------------
types:
  wx:
    0:  { name: temp, type: int,  scale: -1, unit: Cel,  de: "Lufttemperatur",      en: "Air temperature" }
    1:  { name: hum,  type: uint,            unit: "%RH", de: "Relative Feuchte",   en: "Relative humidity" }
    2:  { name: qnh,  type: uint, scale: -1, unit: hPa,  de: "Luftdruck (QNH)",     en: "Pressure (QNH)" }
    3:  { name: wdir, type: uint,            unit: deg,  de: "Windrichtung",        en: "Wind direction" }
    4:  { name: wspd, type: uint, scale: -1, unit: m/s,  de: "Windgeschwindigkeit", en: "Wind speed" }
    5:  { name: gust, type: uint, scale: -1, unit: m/s,  de: "Böe (5 min)",         en: "Gust (5 min)" }
    6:  { name: r1h,  type: uint, scale: -1, unit: mm,   de: "Niederschlag 1 h",    en: "Rain 1 h" }
    7:  { name: r24h, type: uint, scale: -1, unit: mm,   de: "Niederschlag 24 h",   en: "Rain 24 h" }
    8:  { name: rday, type: uint, scale: -1, unit: mm,   de: "Niederschlag seit Mitternacht", en: "Rain since midnight" }
    9:  { name: qfe,  type: uint, scale: -1, unit: hPa,  de: "Luftdruck (QFE)",     en: "Pressure (QFE)" }
    10: { name: dew,  type: int,  scale: -1, unit: Cel,  de: "Taupunkt",            en: "Dew point" }
    11: { name: sol,  type: uint,            unit: W/m2, de: "Globalstrahlung",     en: "Solar radiation" }
    12: { name: uv,   type: uint, scale: -1,             de: "UV-Index",            en: "UV index" }
    13: { name: snow, type: uint,            unit: cm,   de: "Schneehöhe",          en: "Snow depth" }
    # ab Version 2
    14: { name: tmin, type: int,  scale: -1, unit: Cel,  de: "Temperatur-Minimum 24 h", en: "Min. temperature 24 h" }
    15: { name: tmax, type: int,  scale: -1, unit: Cel,  de: "Temperatur-Maximum 24 h", en: "Max. temperature 24 h" }
    16: { name: gmax, type: uint, scale: -1, unit: m/s,  de: "Stärkste Böe 24 h",   en: "Max. gust 24 h" }
    17: { name: ptnd, type: int,  scale: -1, unit: hPa,  de: "Drucktendenz 3 h",    en: "Pressure tendency 3 h" }
    18: { name: r10m, type: uint, scale: -1, unit: mm,   de: "Niederschlag 10 min", en: "Rain 10 min" }
    19: { name: qff,  type: uint, scale: -1, unit: hPa,  de: "Luftdruck (QFF)",     en: "Pressure (QFF)" }
    20: { name: gust10, type: uint, scale: -1, unit: m/s, de: "Windspitze (10 min)", en: "Peak wind (10 min)" }

  # typ 10: Ankündigung, welche Dictionary-Version die Station nutzt und wo es sie gibt
  dict:
    0:  { name: version, type: uint, de: "Version",      en: "Version" }
    1:  { name: hash,    type: tstr, de: "Prüfsumme",    en: "Checksum" }
    2:  { name: source,  type: tstr, de: "Bezugsquelle", en: "Available from" }
    # ab Version 2, Dictionary über Funk. Fest im Programm (Bootstrap), hier nur zur Anzeige:
    3:  { name: zdata,   type: bstr, de: "Gepackte Daten (Teil)", en: "Packed data (part)" }
    4:  { name: zlen,    type: uint, de: "Länge der gepackten Daten", en: "Packed data length" }
    5:  { name: zint,    type: uint, de: "Aussendung über Funk alle … Stunden", en: "Sent over the air every … hours" }

  # typ 13 (ab v4): DX-Zusammenfassung von dxfeed. Seite 1 Stationen (st),
  # Seite 2 Bandaktivität (act). Die Daten stehen in einem Block k data (nicht in
  # dat): so werden sie gepackt und dürfen über mehrere Frames gehen.
  # type rows = Liste von Zeilen, Spalten laut cols:
  # enum/enums = Nummer(n) der Liste (unbekannt: Text, höchstens free_text Zeichen),
  # bits = Bitmaske über die Liste, counts = [Nummer, Anzahl, Nummer, Anzahl ...]
  dxsum:
    0:  { name: end,   type: time, de: "Ende des Zeitraums", en: "End of period" }
    1:  { name: win,   type: uint, unit: min, de: "Zeitraum", en: "Period" }
    2:  { name: calls, type: uint, de: "DX-Rufzeichen", en: "DX calls" }
    3:  { name: spots, type: uint, de: "Spots", en: "Spots" }
    4:  { name: conts, type: tstr, de: "Spotter-Kontinente", en: "Spotter continents" }
    5:  { name: tiers, type: tstr, de: "Relevanzstufen", en: "Relevance tiers" }
    6:  { name: cov,   type: uint, unit: min, de: "Cluster verbunden", en: "Cluster connected" }
    7:  { name: st,    type: rows, de: "DX-Stationen", en: "DX stations",
          cols: [ { name: tier, enum: dxtier, de: "Relevanz" },
                  { name: call, de: "Rufzeichen" },
                  { name: dxcc, enum: dxcc, free_text: 30, de: "Gebiet" },
                  { name: sp,   de: "Spotter" },
                  { name: mw,   de: "Most Wanted" },
                  { name: t0,   unit: min, de: "Erster Spot (min vor Ende)" },
                  { name: t1,   unit: min, de: "Letzter Spot (min vor Ende)" },
                  { name: cw,   bits: band, de: "Bänder CW" },
                  { name: ssb,  bits: band, de: "Bänder SSB" },
                  { name: ft8,  bits: band, de: "Bänder FT8" },
                  { name: oth,  bits: band, de: "Bänder andere" },
                  { name: om,   enums: mode, free_text: 10, de: "Andere Modes" },
                  { name: qrg,  unit: kHz, de: "Letzte Frequenz (kHz)" } ] }
    8:  { name: act,   type: rows, de: "Bandaktivität", en: "Band activity",
          cols: [ { name: band, enum: band, de: "Band" },
                  { name: cw,   de: "CW" },
                  { name: ssb,  de: "SSB" },
                  { name: ft8,  de: "FT8" },
                  { name: oth,  de: "Andere" },
                  { name: peak, de: "Spitze (UTC-Stunde)" },
                  { name: om,   counts: mode, free_text: 10, de: "Andere Modes" } ] }
    10: { name: kind,  type: enum, enum: dxkind, de: "Art", en: "Kind" }   # ab v5
    # ab v5: Spots der letzten Stunde je Band und Kontinent der DX-Station
    # (alle DXCC-Gebiete, Spotter laut conts) - "Bänder jetzt"
    9:  { name: path,  type: rows, de: "Pfade", en: "Paths",
          cols: [ { name: band, enum: band, de: "Band" },
                  { name: af, de: "Afrika" }, { name: an, de: "Antarktis" },
                  { name: as, de: "Asien" },  { name: eu, de: "Europa" },
                  { name: na, de: "Nordamerika" }, { name: oc, de: "Ozeanien" },
                  { name: sa, de: "Südamerika" } ] }
