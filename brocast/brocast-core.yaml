# brocast Kern-Dictionary
#
# Gibt jeder Nummer auf der Luft ihre Bedeutung. Gesendet werden nur die
# Nummern; Namen, Einheiten, Skalierung und Anzeigetexte stehen hier.
#
# Regeln:
#  - Eine vergebene Nummer wird nie umgedeutet (nur "deprecated: true").
#  - Neue Einträge nur in neuer Version; Versionen sind additiv.
#  - scale: Zehnerpotenz. Wert auf der Luft = round(Wert / 10**scale).
#    Beispiel scale -1: 12.5 °C -> 125.
#  - Eine Seite ist genau ein Frame (max. 240 Bytes CBOR); lange Inhalte
#    werden von brocastd in Unterseiten geteilt (Key 23 sub).
#
# Spezifikation: https://claude.ai/code/artifact/bf4b91a7-7807-42d7-b72e-5739d9c257bd
#
# VERSION 1 IST EINGEFROREN (02.10.2026, Prüfsumme 1b082f65).
# Inhaltliche Änderungen nur noch als Version 2 (version: 2, nur Ergänzungen),
# verteilt über TinyBox DICT. Version 3 (19.10.2026): Quellen-Liste src, damit
# feste Quellenangaben (z. B. GeoSphere-Lizenzhinweis) nur 1 Byte kosten.
# Version 4 (23.10.2026): DX-Zusammenfassung typ 13 dxsum mit Thema dxsum,
# Listen band, mode, dxtier und dxcc (ADIF-Nummern, für alle Seitentypen).
# Version 5 (25.10.2026): dxsum path (Band × DX-Kontinent, "Bänder jetzt"),
# kind (Liste dxkind), Spalte qrg am Ende der Stationszeilen st.
# Kommentare dürfen geändert werden – sie gehen
# nicht in die Prüfsumme ein. Der Test test_v1_is_frozen wacht darüber.

dictionary: brocast-core
version: 5
languages: [de, en]

# ---------------------------------------------------------------------------
# Seiten-Umschlag: positive Keys 0..23, in jeder Seite gleich
# ---------------------------------------------------------------------------
envelope:
  0:  { name: dv,   type: uint,      required: true, de: "Dictionary-Version", en: "Dictionary version" }
  1:  { name: id,   type: uint,      required: true, de: "Seiten-ID", en: "Page ID" }
  2:  { name: rev,  type: uint,      default: 0, de: "Revision", en: "Revision" }
  3:  { name: org,  type: callsign,  default: "@ax25_src", de: "Urheber", en: "Originator" }
  4:  { name: t,    type: time,      required: true, de: "Erstellt", en: "Created" }
  5:  { name: exp,  type: uint, unit: min, default: "@typ", de: "Gültig für", en: "Valid for" }
  6:  { name: typ,  type: enum, enum: typ, required: true, de: "Seitentyp", en: "Page type" }
  7:  { name: flg,  type: bits, enum: flg, default: 0, de: "Kennzeichen", en: "Flags" }
  8:  { name: ti,   type: tstr, max: 40, de: "Titel", en: "Title" }
  9:  { name: txt,  type: tstr, de: "Kurztext", en: "Summary" }
  10: { name: to,   type: any,  de: "Adressat", en: "Addressee" }
  11: { name: area, type: tstr, de: "Gebiet", en: "Area" }
  12: { name: pos,  type: position, de: "Ort", en: "Position" }
  13: { name: sym,  type: tstr, max: 2, default: "@typ", de: "Symbol", en: "Symbol" }
  14: { name: lnk,  type: pagerefs, de: "Links", en: "Links" }
  15: { name: ref,  type: pageref,  de: "Bezug", en: "Reference" }
  16: { name: pri,  type: enum, enum: pri, default: 0, de: "Priorität", en: "Priority" }
  17: { name: lang, type: enum, enum: lang, default: 0, de: "Sprache", en: "Language" }
  18: { name: cat,  type: enums, enum: cat, free_text: 20, de: "Rubriken", en: "Categories" }   # eigene Rubriken als Text, max. 20 Zeichen
  19: { name: blk,  type: blocks, de: "Inhalt", en: "Content" }
  20: { name: dat,  type: data, de: "Daten", en: "Data" }
  21: { name: src,  type: enums, enum: src, free_text: 60, de: "Quelle", en: "Source" }   # ab v3: Liste src oder Text (z. B. Rufzeichen)
  22: { name: crit, type: any,  de: "Muss verstanden werden", en: "Critical keys" }
  23: { name: sub,  type: subpage, de: "Unterseite", en: "Subpage" }   # [n, gesamt], nur bei geteilten Seiten

# ---------------------------------------------------------------------------
# Darstellungs-Bausteine: negative Keys -1..-24, in blk (und dat) verwendbar
# ---------------------------------------------------------------------------
block_keys:
  -1:  { name: k,    type: enum, enum: block, de: "Blockart", en: "Block kind" }
  -2:  { name: x,    type: tstr, de: "Text", en: "Text" }
  -3:  { name: v,    type: any,  de: "Wert", en: "Value" }
  -4:  { name: u,    type: enum, enum: unit, de: "Einheit", en: "Unit" }
  -5:  { name: n,    type: any,  de: "Bezeichnung", en: "Label" }
  -6:  { name: dt,   type: int,  unit: s, de: "Zeitversatz", en: "Time offset" }
  -7:  { name: pos,  type: position, de: "Ort", en: "Position" }
  -8:  { name: href, type: pageref, de: "Linkziel", en: "Link target" }
  -9:  { name: rows, type: any,  de: "Zeilen", en: "Rows" }
  -10: { name: hdr,  type: any,  de: "Spaltenköpfe", en: "Header" }
  -11: { name: lo,   type: any,  de: "Minimum", en: "Minimum" }
  -12: { name: hi,   type: any,  de: "Maximum", en: "Maximum" }
  -13: { name: st,   type: enum, enum: state, de: "Zustand", en: "State" }
  -14: { name: acc,  type: any,  de: "Genauigkeit", en: "Accuracy" }
  -15: { name: sc,   type: int,  de: "Skalierung", en: "Scale" }
  # -16..-24: Reserve

# ---------------------------------------------------------------------------
# Aufzählungen (Werte 0..23 kosten 1 Byte)
# ---------------------------------------------------------------------------
