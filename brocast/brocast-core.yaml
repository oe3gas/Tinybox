    2:  { name: tlm,   de: "Telemetrie",           en: "Telemetry",       exp: 60,   sym: "/T" }
    3:  { name: msg,   de: "Nachricht",            en: "Message",         exp: 1440 }
    4:  { name: ack,   de: "Quittung",             en: "Acknowledgement", exp: 60 }
    5:  { name: obj,   de: "Objekt / Ort",         en: "Object / place",  exp: 1440 }
    6:  { name: node,  de: "Stationsstatus",       en: "Station status",  exp: 120 }
    7:  { name: dx,    de: "DX-Spot",              en: "DX spot",         exp: 30 }
    8:  { name: alert, de: "Warnung / Notfunk",    en: "Alert",           exp: 360 }
    9:  { name: index, de: "Inhaltsverzeichnis",   en: "Index",           exp: 1440 }
    10: { name: dict,  de: "Dictionary-Seite",     en: "Dictionary page", exp: 10080 }
    11: { name: formreply, de: "Formularantwort",  en: "Form reply", reserved: v2 }
