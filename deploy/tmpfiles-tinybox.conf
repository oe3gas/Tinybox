# Installed by TinyBox deploy/install.sh as /etc/tmpfiles.d/tinybox.conf
# RAM folders (/run is tmpfs): transient files never touch the eMMC.
# Last column = age after which systemd-tmpfiles-clean deletes old files.
d /run/tinybox                   0755 tinybox tinybox -
d /run/tinybox/sendeprotokoll    0755 tinybox tinybox 7d
d /run/tinybox/eingang           0755 tinybox tinybox -
d /run/tinybox/eingang/erledigt  0755 tinybox tinybox 2d
d /run/tinybox/eingang/fehler    0755 tinybox tinybox 7d
