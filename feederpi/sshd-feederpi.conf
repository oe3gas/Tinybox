# Installed by feederpi/install.sh as /etc/ssh/sshd_config.d/feederpi.conf
# The PC logs in as "abholer" with its own key and can do exactly one thing:
# fetch the finished bulletins (abholung.sh). No shell, no tunnel, no password.
Match User abholer
    ForceCommand /usr/local/lib/feederpi/abholung.sh
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PermitTTY no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    X11Forwarding no
    PermitTunnel no
