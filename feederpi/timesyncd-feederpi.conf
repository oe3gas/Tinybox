# Installed by feederpi/install.sh as /etc/systemd/timesyncd.conf.d/feederpi.conf
# The Pi has no battery-backed clock: without NTP the 05:00 DX digest and the
# 24-hour window are wrong after every power cut. install.sh also enables
# systemd-time-wait-sync, so the timers only start once the clock is synced.
# A local NTP server (e.g. the MikroTik) can go first: NTP=10.0.0.1 0.at.pool.ntp.org ...
[Time]
NTP=0.at.pool.ntp.org 1.at.pool.ntp.org 2.at.pool.ntp.org
FallbackNTP=0.debian.pool.ntp.org 1.debian.pool.ntp.org time.cloudflare.com
