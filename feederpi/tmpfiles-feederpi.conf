# Installed by feederpi/install.sh as /etc/tmpfiles.d/feederpi.conf
# Outbox in RAM (/run is tmpfs): the jobs write here, the PC fetches over SSH
# (user abholer, group tinybox; setgid so the group can move fetched files).
# Last column = age after which systemd-tmpfiles-clean deletes old files.
d /run/tinybox                   0755 tinybox tinybox -
d /run/tinybox/ausgang           2775 tinybox tinybox -
d /run/tinybox/ausgang/abgeholt  2775 tinybox tinybox 2d
